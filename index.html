<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NFT Tips Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3a53'/%3E%3Cpath d='M6 19c3 3 7 3 10 0s7-3 10 0' stroke='%2350c8c6' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-label="Newport Fun Tours tips" role="img" fill="none">
      <rect width="40" height="40" rx="10" fill="currentColor"/>
      <path d="M7 24c4 4 9 4 13 0s9-4 13 0" stroke="#50c8c6" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="20" cy="14" r="4.5" fill="#fff"/>
    </svg>
    <div><div class="brand-name">Newport Fun Tours</div><div class="brand-sub">Tips report</div></div>
  </div>
  <button id="logout" class="ghost hidden" type="button">Lock</button>
</header>

<main>
  <!-- LOGIN -->
  <section id="login" class="card narrow">
    <h1>Tips report</h1>
    <p class="muted">Enter the office password to continue.</p>
    <form id="loginForm">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Unlock</button>
      <p id="loginErr" class="err hidden" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <div class="card setup">
      <h1>Build a tips report</h1>
      <div class="grid3">
        <div><label for="start">Period start</label><input id="start" type="date"></div>
        <div><label for="end">Period end</label><input id="end" type="date"></div>
        <div class="quick"><span class="label">Quick pick</span>
          <div class="chips"><button type="button" class="chip" data-q="prev">Last half-month</button><button type="button" class="chip" data-q="cur">This half-month</button></div>
        </div>
      </div>

      <label class="drop" id="drop" for="csv">
        <input id="csv" type="file" accept=".csv,text/csv">
        <span class="drop-title" id="dropTitle">Upload the Homebase timesheet CSV</span>
        <span class="muted" id="dropSub">Drag it here or tap to choose. The file stays on this device.</span>
      </label>

      <details class="settings">
        <summary>Settings and commissions</summary>
        <div class="grid2">
          <div><label for="office">Office staff split by hours (Homebase names, comma separated)</label><input id="office" type="text"></div>
          <div><label for="fallback">Gets office share when no office staff clocked in</label><input id="fallback" type="text"></div>
          <div><label for="five">5% each (comma separated)</label><input id="five" type="text"></div>
          <div><label for="dockRoles">Dock roles for the dock estimate (comma separated)</label><input id="dockRoles" type="text"></div>
        </div>
        <h3>Commissions (entered by hand)</h3>
        <div id="commRows"></div>
        <button type="button" class="ghost small" id="addComm">Add person</button>
      </details>

      <div class="actions">
        <button class="primary" id="run" type="button">Run report</button>
        <span id="status" class="muted" aria-live="polite"></span>
      </div>
    </div>

    <div id="report" class="hidden"></div>
  </section>
</main>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
